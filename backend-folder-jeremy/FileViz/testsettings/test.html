<!DOCTYPE html>
<html>
<head>
  <title>Settings Test</title>
  <style>
    body { font-family: sans-serif; background: #2b2b2b; color: #fff; padding: 20px; }
    input { width: 400px; padding: 6px; background: #3f3f3f; color: #fff; border: 1px solid #555; }
    button { padding: 6px 12px; margin-left: 8px; background: #3f3f3f; color: #fff; border: 1px solid #555; cursor: pointer; }
    #folders { margin-top: 20px; }
    .folder-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .error { color: #ff6b6b; }
    .success { color: #6fcf97; }
  </style>
</head>
<body>
  <h2>Saved Folders</h2>

  <div>
    <input type="text" id="pathInput" placeholder="e.g. C:\Users\bucki\Desktop" />
    <button onclick="addFolder()">Add</button>
  </div>

  <p id="message"></p>

  <div id="folders"></div>

  <script>
    const API = "http://localhost:5002";

    async function loadFolders() {
      const res = await fetch(`${API}/folders`);
      const folders = await res.json();
      const container = document.getElementById("folders");
      if (folders.length === 0) {
        container.innerHTML = "<p style='color:#888'>No folders saved yet.</p>";
        return;
      }
      container.innerHTML = folders.map(f => `
        <div class="folder-row">
          <span>${f}</span>
          <button onclick="removeFolder('${f.replace(/\\/g, "\\\\")}')">Remove</button>
        </div>
      `).join("");
    }

    async function addFolder() {
      const path = document.getElementById("pathInput").value.trim();
      const msg = document.getElementById("message");
      if (!path) return;

      const res = await fetch(`${API}/folders?path=${encodeURIComponent(path)}`, { method: "POST" });
      const text = await res.text();

      if (res.ok) {
        msg.className = "success";
        msg.textContent = text;
        document.getElementById("pathInput").value = "";
        loadFolders();
      } else {
        msg.className = "error";
        msg.textContent = text;
      }
    }

    async function removeFolder(path) {
      await fetch(`${API}/folders?path=${encodeURIComponent(path)}`, { method: "DELETE" });
      loadFolders();
    }

    loadFolders();
  </script>
</body>
</html>
